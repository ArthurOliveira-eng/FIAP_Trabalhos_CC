#res .card,#res .tw{color:var(--ink)}

@media(max-width:760px){.app{flex-direction:column;margin:0;border-radius:0;min-height:100vh}.side{width:auto}.grid2{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap}}

function valida(d){if(!MODS[d.id_modulo])throw new Error("Módulo inexistente: "+d.id_modulo);
 if(!/^\d{4}-\d\d-\d\d \d\d:\d\d$/.test(d.data_hora))throw new Error("data_hora deve seguir AAAA-MM-DD HH:MM.");

 if(d.temperatura_c<-100||d.temperatura_c>100)throw new Error("Temperatura fora da faixa plausível.")}

function abrir(id){S.edit=id?S.rows.find(l=>l.id_leitura===id):null;S.step=1;const e=S.edit;S.d=e?{...e}:{id_modulo:Object.keys(MODS).find(m=>can(m,"C"))||"HAB-01",data_hora:"2026-11-10 00:00"};S.view="form";render()}
async function salvar(){const d=numD();
 try{if(S.edit)await api("PUT","/leituras/"+S.edit.id_leitura,d);else await api("POST","/leituras",d);toast(S.edit?"Leitura alterada.":"Leitura cadastrada.");S.edit=null;S.view="leituras";await load()}catch(e){toast(e.message,1)}}
async function excluir(id){if(S.del!==id){S.del=id;render();clearTimeout(excluir.t);excluir.t=setTimeout(()=>{S.del=null;render()},3000);return}
 try{await api("DELETE","/leituras/"+id);toast("Leitura excluída.");S.del=null;await load()}catch(e){S.del=null;toast(e.message,1);render()}}
function setPerfil(k){S.perfil=k;render()}
function render(){$("#main").innerHTML=views[S.view]();if(after[S.view])after[S.view]();
 const IC={"painel": "M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10", "leituras": "M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01", "simulacao": "M3 12c3-8 6-8 9 0s6 8 9 0", "regressao": "M3 17l6-6 4 4 8-9M15 6h6v6", "circuito": "M7 7h10v10H7zM9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4", "estruturas": "M9 3h6v5H9zM3 16h6v5H3zM15 16h6v5h-6zM12 8v4M6 16v-4h12v4", "perfis": "M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"},NAVI=[["painel", "Painel"], ["leituras", "Leituras (CRUD)"], ["simulacao", "Simulação"], ["regressao", "Modelo linear"], ["circuito", "Circuito lógico"], ["estruturas", "Estruturas de dados"], ["perfis", "Perfis e acesso"]],ico=k=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[k]}"/></svg>`,on=v=>S.view===v||(S.view==="form"&&v==="leituras")?"on":"";
 $("#nav").innerHTML=NAVI.map(([v,t])=>`<button class="${on(v)}" onclick="ir('${v}')">${ico(v)}${t}</button>`).join("");
 $("#perfil").innerHTML=Object.keys(PERF).map(k=>`<option ${k===S.perfil?"selected":""}>${k}</option>`).join("");$("#av").textContent=S.perfil.slice(0,2).toUpperCase();
 $("#mode").textContent=S.demo?"Modo demonstração (memória)":"Banco SQLite conectado"}
$("#perfil").onchange=e=>setPerfil(e.target.value);load();
</script></body></html>
